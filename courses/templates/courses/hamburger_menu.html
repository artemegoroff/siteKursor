<div
        id="sideMenuOverlay"
        class="side-menu-overlay"
></div>

<aside
        id="mySidenav"
        class="sidenav"
        aria-hidden="true"
        aria-label="Содержание курса"
        inert
>
    <div class="sidenav__header">
        <a
                class="sidenav__title"
                href="{{ course.get_absolute_url }}"
        >
            {{ course.title }}
        </a>

        <button
                type="button"
                class="sidenav__close"
                data-menu-close
                aria-label="Закрыть меню"
        >
            &times;
        </button>
    </div>

    <div class="sidenav__body">
        <nav aria-label="Уроки курса">
            {% for one_module in modules %}
                <details
                        class="lesson-menu-module"
                        {% if one_module.is_on_current_path %}open{% endif %}
                >
                    <summary>
                        {{ forloop.counter }}. {{ one_module.title }}
                    </summary>

                    {% include "courses/includes/lesson_tree.html" with nodes=one_module.lessons_for_menu only %}
                </details>
            {% empty %}
                <p>Модули пока не добавлены.</p>
            {% endfor %}
        </nav>
    </div>
</aside>

<button
        type="button"
        class="side-menu-toggle"
        data-menu-open
        aria-controls="mySidenav"
        aria-expanded="false"
        aria-label="Открыть содержание курса"
>
    <span aria-hidden="true">☰</span>
    <span class="side-menu-toggle__text">Уроки</span>
</button>
